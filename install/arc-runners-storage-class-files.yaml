kind: StorageClass
apiVersion: storage.k8s.io/v1
metadata:
  name: github-azurefile
provisioner: file.csi.azure.com
reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: true
mountOptions:
  - dir_mode=0777
  - file_mode=0777
  - uid=1001
  - gid=123
  - mfsymlinks
  - cache=strict # https://linux.die.net/man/8/mount.cifs
  - nosharesock
  - nobrl # disable sending byte range lock requests to the server and for applications which have challenges with posix locks
  - actimeo=30  
parameters:
  skuName: Standard_LRS
  storageAccount: metadatacaching11        # reuse the existing keyless storage account (SMB OAuth on, shared key access off)
  resourceGroup: aks-files-actions         # resource group of the storage account above
  mountWithManagedIdentity: "true"         # keyless SMB mount using the node pool kubelet managed identity
